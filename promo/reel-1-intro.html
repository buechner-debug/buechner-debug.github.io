<title>KI-Engineer Intro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter+Tight:wght@300;400;600;700&family=DM+Mono&display=swap">
<style>
  :root {
    --bg: #08090b;
    --fg: #e2e4e9;
    --accent: #c8ff4d;
    --plasma: #6e7bff;
    --muted: #8b8f9a;
    --surface: #111318;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #08090b;
      --fg: #e2e4e9;
      --accent: #c8ff4d;
      --plasma: #6e7bff;
      --muted: #8b8f9a;
      --surface: #111318;
      color-scheme: dark;
    }
  }
  :root[data-theme="light"] {
    --bg: #08090b;
    --fg: #e2e4e9;
    --accent: #c8ff4d;
    --plasma: #6e7bff;
    --muted: #8b8f9a;
    --surface: #111318;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    overflow: hidden;
    font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
  }


  .reel {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    transform-origin: top left;
  }

  canvas#particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    z-index: 2;
  }

  .initials {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 200px;
    font-weight: 400;
    letter-spacing: 0.1em;
    opacity: 0;
    transform: scale(0.8);
    color: var(--fg);
  }

  .line {
    width: 100px;
    height: 2px;
    background: var(--accent);
    margin: 50px 0;
    transform: scaleX(0);
  }

  .name {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 108px;
    font-weight: 400;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    letter-spacing: -0.02em;
  }

  .role {
    font-family: 'DM Mono', monospace;
    font-size: 40px;
    font-weight: 300;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 20px;
    opacity: 0;
    transform: translateY(20px);
  }

  .tagline {
    font-size: 54px;
    font-weight: 300;
    color: var(--muted);
    text-align: center;
    max-width: 900px;
    line-height: 1.35;
    margin-top: 80px;
    opacity: 0;
    transform: translateY(20px);
  }

  .skills-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 60px;
    max-width: 920px;
  }

  .skill-pill {
    font-size: 34px;
    font-weight: 400;
    padding: 16px 36px;
    border: 1px solid var(--muted);
    border-radius: 100px;
    color: var(--muted);
    opacity: 0;
    transform: scale(0.8);
    white-space: nowrap;
  }

  .cta-bar {
    position: absolute;
    bottom: 120px;
    left: 0;
    right: 0;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
  }

  .cta-text {
    font-size: 26px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .cta-url {
    font-size: 30px;
    color: var(--accent);
    font-weight: 600;
    margin-top: 10px;
  }

  .phase { display: none; }
  .phase.active { display: flex; }
</style>

<div class="reel" id="reel">
  <canvas id="particles"></canvas>

  <div class="content" id="scene-intro">
    <div class="initials" id="initials">CB</div>
    <div class="line" id="line1"></div>
    <div class="name" id="name1">Christopher Büchner</div>
    <div class="role" id="role1">KI-Automation</div>
  </div>

  <div class="content" id="scene-what" style="display:none">
    <div class="tagline" id="tagline1" style="margin-top:0;font-size:64px;color:var(--fg);font-weight:400;font-family:'Instrument Serif',serif">Was ich mache</div>
    <div class="line" id="line2" style="margin:40px 0"></div>
    <div class="tagline" id="tagline2" style="margin-top:0">Ich baue Automationen, die Routinearbeit übernehmen.</div>
    <div class="skills-row" id="skills1">
      <span class="skill-pill">n8n</span>
      <span class="skill-pill">Sprachmodelle</span>
      <span class="skill-pill">Python</span>
      <span class="skill-pill">Node.js</span>
      <span class="skill-pill">React</span>
    </div>
  </div>

  <div class="content" id="scene-cta" style="display:none">
    <div class="initials" id="initials2" style="font-size:140px;color:var(--accent)">CB</div>
    <div class="line" id="line3" style="margin:40px 0"></div>
    <div class="tagline" id="cta-main" style="margin-top:0;font-size:72px;color:var(--fg);font-weight:400;font-family:'Instrument Serif',serif">Nächstes Ziel: KI-Engineer.</div>
    <div class="role" id="cta-url" style="margin-top:50px;font-size:36px;letter-spacing:0.05em;text-transform:none">buechner-debug.github.io</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  canvas.width = 1080;
  canvas.height = 1920;

  const particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * 1080,
      y: Math.random() * 1920,
      r: Math.random() * 3 + 1,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      a: Math.random() * 0.3 + 0.1,
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, 1080, 1920);
    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = 1080;
      if (p.x > 1080) p.x = 0;
      if (p.y < 0) p.y = 1920;
      if (p.y > 1920) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 255, 77, ${p.a})`;
      ctx.fill();
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  function animate(el, props, duration, delay = 0) {
    return new Promise((resolve) => {
      setTimeout(() => {
        el.style.transition = `all ${duration}ms cubic-bezier(0.16, 1, 0.3, 1)`;
        Object.assign(el.style, props);
        setTimeout(resolve, duration);
      }, delay);
    });
  }

  async function playIntro() {
    const initials = document.getElementById('initials');
    const line1 = document.getElementById('line1');
    const name1 = document.getElementById('name1');
    const role1 = document.getElementById('role1');

    await animate(initials, { opacity: '1', transform: 'scale(1)' }, 800, 300);
    await animate(line1, { transform: 'scaleX(1)' }, 600, 200);
    await animate(name1, { opacity: '1', transform: 'translateY(0)' }, 700, 100);
    await animate(role1, { opacity: '1', transform: 'translateY(0)' }, 600, 200);
    await new Promise((r) => setTimeout(r, 1200));
  }

  async function playWhat() {
    document.getElementById('scene-intro').style.display = 'none';
    const scene = document.getElementById('scene-what');
    scene.style.display = 'flex';

    const t1 = document.getElementById('tagline1');
    const line2 = document.getElementById('line2');
    const t2 = document.getElementById('tagline2');
    const pills = document.querySelectorAll('#skills1 .skill-pill');

    await animate(t1, { opacity: '1', transform: 'translateY(0)' }, 700, 200);
    await animate(line2, { transform: 'scaleX(1)' }, 500, 100);
    await animate(t2, { opacity: '1', transform: 'translateY(0)' }, 700, 100);

    for (let i = 0; i < pills.length; i++) {
      animate(pills[i], { opacity: '1', transform: 'scale(1)' }, 400, i * 80);
    }
    await new Promise((r) => setTimeout(r, pills.length * 80 + 400 + 800));
  }

  async function playCta() {
    document.getElementById('scene-what').style.display = 'none';
    const scene = document.getElementById('scene-cta');
    scene.style.display = 'flex';

    const i2 = document.getElementById('initials2');
    const line3 = document.getElementById('line3');
    const cta = document.getElementById('cta-main');
    const url = document.getElementById('cta-url');

    await animate(i2, { opacity: '1', transform: 'scale(1)' }, 800, 300);
    await animate(line3, { transform: 'scaleX(1)' }, 500, 200);
    await animate(cta, { opacity: '1', transform: 'translateY(0)' }, 700, 100);
    await animate(url, { opacity: '1', transform: 'translateY(0)' }, 600, 300);
    await new Promise((r) => setTimeout(r, 2000));
  }

  async function play() {
    await playIntro();
    await playWhat();
    await playCta();
  }

  play();

  // Scale to fit viewport
  function fitReel() {
    const reel = document.getElementById('reel');
    const scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
    reel.style.transform = `scale(${scale})`;
  }
  fitReel();
  window.addEventListener('resize', fitReel);
</script>
